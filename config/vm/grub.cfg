set timeout=2
set default=0
# The version in the menuentry below is generated by scripts/build.sh
# from the VERSION file, so the bootloader menu can never go stale
# again (an earlier release shipped a menu with a stale version
# because this file was hand-edited).
menuentry "nxtsOS @VERSION@" {
    multiboot /boot/nxtsOS.bin
    boot
}
