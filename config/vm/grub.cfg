set timeout=2
set default=0
# Graphics mode for the kernel, v0.7.1: ask GRUB itself for
# 800x600x32 and keep it for the kernel, in addition to the
# Multiboot header request. This helps emulators (notably Bochs)
# where GRUB's Multiboot video handling alone did not set a mode
# and the kernel booted in text mode with no framebuffer. If the
# mode is unavailable, GRUB falls back to text mode as before.
set gfxmode=800x600x32
set gfxpayload=keep
# The version in the menuentry below is generated by scripts/build.sh
# from the VERSION file, so the bootloader menu can never go stale
# again (an earlier release shipped a menu with a stale version
# because this file was hand-edited).
menuentry "nxtsOS @VERSION@" {
    multiboot /boot/nxtsOS.bin
    boot
}
